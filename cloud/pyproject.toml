[project]
name = "capta-cloud"
version = "0.1.0"
description = "Capta Cloud: il server di Capta Lead (account, aziende, eventi, lead, integrazioni)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pydantic[email]>=2.7",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "boto3>=1.43.111",
]

[project.scripts]
capta-cloud = "capta_cloud.avvio:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capta_cloud"]
